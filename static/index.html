<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SAI</title>
    <style>
        body {
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        h2 {
            margin-top: 40px;
            margin-bottom: 15px;
            color: #333;
        }

        /* ===================== */
        /* Grid Containers */
        /* ===================== */
        .primary-grid,
        .secondary-grid,
        .tertiary-grid {
            display: grid;
            gap: 15px;
            margin: 20px 0;
        }

        .primary-grid {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }
        .secondary-grid {
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }
        .tertiary-grid {
            grid-template-columns: repeat(5, 1fr); /* Máximo 5 columnas */
        }

        /* ===================== */
        /* Tarjetas */
        /* ===================== */
        .card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            min-height: 100px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        .primary-card {
    		color: #000066; /* azul oscuro suave */
	}
	.secondary-card {
    		color: #000066; 
	}
	.tertiary-card {
    		color: #000066; /* gris neutro */
	}


        .card-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .card-value {
            font-size: 1.5em;
        }

        /* ===================== */
        /* Responsive */
        /* ===================== */
        @media (max-width: 1200px) {
            .primary-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
            .secondary-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            }
            .tertiary-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .primary-grid, .secondary-grid, .tertiary-grid {
                grid-template-columns: repeat(auto-fit, minmax(100%, 1fr));
            }
        }
	.OL { background-color: #28a745; }
        .OB { background-color: #dc3545; }
    </style>
</head>
<body>
    <h1>Dashboard UPS</h1>

    <h2>Datos Principales</h2>
    <div class="primary-grid">
        <div class="card primary-card">
            <div class="card-title">Porcentaje batería SAI</div>
            <div class="card-value" id="battery-charge">-- %</div>
        </div>
        <div class="card primary-card">
            <div class="card-title">Carga efectiva actual del SAI</div>
            <div class="card-value" id="ups-load">-- %</div>
        </div>
        <div class="card primary-card">
            <div class="card-title">Fuente de energía del sistema</div>
            <div class="card-value" id="ups-status">--</div>
        </div>
    </div>

    <h2>Datos Secundarios</h2>
    <div class="secondary-grid">
        <div class="card secondary-card">
            <div class="card-title">Frecuencia de refresco de datos</div>
            <div class="card-value" id="poll-interval">-- s</div>
        </div>
        <div class="card secondary-card">
            <div class="card-title">Frecuencia de electricidad entrante</div>
            <div class="card-value" id="input-frequency">-- Hz</div>
        </div>
        <div class="card secondary-card">
            <div class="card-title">Voltaje de entrada</div>
            <div class="card-value" id="input-voltage">-- V</div>
        </div>
    </div>

    <h2>Información Extra</h2>
    <div class="tertiary-grid" id="tertiary-grid">
        <!-- Tarjetas terciarias se generarán dinámicamente -->
    </div>

    <script>
        async function fetchUPS() {
            const res = await fetch("/ups/raw");
            const data = await res.json();

            // Principales
            document.getElementById("battery-charge").textContent = data["battery.charge"] + " %";
            document.getElementById("ups-load").textContent = data["ups.load"] + " %";
            document.getElementById("ups-status").textContent = data["ups.status"] === "OL" ? "Electricidad" : "Batería";
                
		const statusEl = document.getElementById("ups-status");
                const status = data["ups.status"];
                if(status === "OL") {
                    statusEl.textContent = "Electricidad";
                    statusEl.className = "status-badge OL";
                } else if(status === "OB") {
                    statusEl.textContent = "Batería";
                    statusEl.className = "status-badge OB";
                } else {
                    statusEl.textContent = status || "--";
                    statusEl.className = "status-badge";
                }



            // Secundarios
            document.getElementById("poll-interval").textContent = data["driver.parameter.pollinterval"] + " s";
            document.getElementById("input-frequency").textContent = data["input.frequency"] + " Hz";
            document.getElementById("input-voltage").textContent = data["input.voltage"] + " V";
            //document.getElementById("ups-temp").textContent = data["ups.temperature"] ? data["ups.temperature"] + " °C" : "--";

            // Terciarios
            const tertiaryGrid = document.getElementById("tertiary-grid");
            tertiaryGrid.innerHTML = "";
            const primaryKeys = ["battery.charge","ups.load","ups.status"];
            const secondaryKeys = ["driver.parameter.pollinterval","input.frequency","input.voltage","ups.temperature"];
            for (const key in data) {
                if (!primaryKeys.includes(key) && !secondaryKeys.includes(key)) {
                    const value = data[key];
                    const card = document.createElement("div");
                    card.className = "card tertiary-card";
                    card.innerHTML = `<div class="card-title">${key}</div><div class="card-value">${value}</div>`;
                    tertiaryGrid.appendChild(card);
                }
            }
        }

        fetchUPS();
        setInterval(fetchUPS, 2000);
    </script>
</body>
</html>
